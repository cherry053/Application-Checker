[theme]
base = "light"
primaryColor = "#002664"
textColor = "#22272B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"

[server]
# Serve files under ./static at /app/static/* so the vendored NSW Design
# System CSS loads without any dependency on an external CDN.
enableStaticServing = true

[browser]
gatherUsageStats = false
